name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Zero-warning gates for every workspace (library, playground, docs, backend).
      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Type-check
        run: pnpm typecheck

      - name: Test (coverage thresholds + doc-contract)
        run: pnpm --filter @vue-stripe/vue-stripe test:coverage

      # Plain-text summary (no third-party action, no emoji), one comment updated in place.
      - name: Coverage summary on the PR
        if: always() && matrix.node == 24 && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: node scripts/coverage-comment.mjs packages/vue-stripe/coverage/coverage-summary.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Upload coverage
        if: always() && matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: packages/vue-stripe/coverage/lcov.info

      - name: Build package
        run: pnpm --filter @vue-stripe/vue-stripe build

      - name: Build docs (VitePress)
        run: pnpm --filter @vue-stripe/docs build

  vue2-smoke:
    name: Vue 2.7 compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Mounts the built dist/ on Vue 2.7.16 and checks it imports no Vue-3-only helpers.
      - name: Build library
        run: pnpm --filter @vue-stripe/vue-stripe build

      - name: Vue 2.7 smoke test
        run: pnpm --filter @vue-stripe/vue2-smoke test

      # vue-tsc on the built dist/types, Vue 2.7 and Vue 3, skipLibCheck false and true.
      - name: Type declarations on Vue 2.7 and Vue 3
        run: pnpm --filter @vue-stripe/vue2-smoke typecheck

  size:
    name: Bundle size and dead code
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm --filter @vue-stripe/vue-stripe build

      # Fails when an entry exceeds its budget in packages/vue-stripe/.size-limit.json.
      - name: Size budgets
        run: pnpm --filter @vue-stripe/vue-stripe exec size-limit --json > /tmp/size-current.json

      - name: Unused files, exports and dependencies (knip)
        run: pnpm knip

      - name: Advisories report (non-blocking)
        continue-on-error: true
        run: pnpm audit --audit-level critical --prod

      # Size of the PR's base, for the diff in the PR comment.
      - name: Base size
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git worktree add /tmp/base ${{ github.event.pull_request.base.sha }}
          cd /tmp/base
          pnpm install --frozen-lockfile
          pnpm --filter @vue-stripe/vue-stripe build
          pnpm --filter @vue-stripe/vue-stripe exec size-limit --json > /tmp/size-base.json || rm -f /tmp/size-base.json

      - name: Size comment on the PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: node scripts/size-comment.mjs /tmp/size-current.json /tmp/size-base.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every commit in the PR (base..head) must be a Conventional Commit.
      - name: Lint commit messages
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
