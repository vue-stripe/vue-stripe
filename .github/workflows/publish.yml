name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  # npm provenance attestation (sigstore) needs the OIDC token.
  id-token: write

jobs:
  publish:
    # Manual runs must also be started from a v* tag, never from a branch.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the tag matches packages/vue-stripe/package.json
        run: test "v$(node -p "require('./packages/vue-stripe/package.json').version")" = "$GITHUB_REF_NAME"

      - name: Test (coverage thresholds + doc-contract + conventions)
        run: pnpm --filter @vue-stripe/vue-stripe test:coverage

      - name: Build the library
        run: pnpm --filter @vue-stripe/vue-stripe build

      - name: Vue 2.7 smoke test
        run: pnpm --filter @vue-stripe/vue2-smoke test

      - name: Bundle size budgets
        run: pnpm --filter @vue-stripe/vue-stripe size

      # A pre-release version goes to the dist-tag named by its identifier (6.0.0-beta.0 ->
      # `beta`, 6.0.0-rc.1 -> `rc`), so `npm install @vue-stripe/vue-stripe` keeps resolving
      # to the latest stable release.
      - name: Publish to npm
        working-directory: packages/vue-stripe
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            dist_tag=$(echo "$GITHUB_REF_NAME" | sed -E 's/^v[0-9.]+-([A-Za-z]+).*/\1/')
            npm publish --access public --provenance --tag "$dist_tag"
          else
            npm publish --access public --provenance
          fi
        # No NODE_AUTH_TOKEN: npm authenticates through Trusted Publishing (GitHub OIDC,
        # `id-token: write` above), configured on npmjs.com for this repo and publish.yml.
        # A token in the environment would take precedence and fail.

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag $prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
